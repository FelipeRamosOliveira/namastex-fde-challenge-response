[project]
name = "autoseguro-agent"
version = "1.0.0"
description = "Agente de cotação de seguro auto (desafio FDE Namastex): LangGraph + FastMCP, assíncrono, com guardrails de PII."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.28",
  "pydantic>=2.12",
  "pydantic-settings>=2.6",
  "langgraph>=1.2",
  "langgraph-checkpoint-sqlite>=3.0",
  "fastmcp>=4.0",
  "redis>=5.2",
  "pandas>=2.2",
  "pyarrow>=21",
  "cryptography>=44",
]

[project.optional-dependencies]
# Etapa 6: simulador de leads e avaliação com fast-agent
sim = ["fast-agent-mcp>=0.10"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "ruff>=0.8",
  "fakeredis[lua]>=2.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autoseguro"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-m 'not llm'"  # teste ao vivo com Groq: uv run pytest -m llm tests/live
pythonpath = ["tests/unit"]
markers = [
  "integration: sobe a quote-api real do desafio (vendor/challenge) em processo local",
  "llm: chama o Groq de verdade (precisa de GROQ_API_KEY e rede)",
]

[tool.ruff]
line-length = 110
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101", "B008"]  # B008: Depends() é o idioma do FastAPI

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B", "ASYNC"]
"scripts/**" = ["S", "E501"]
