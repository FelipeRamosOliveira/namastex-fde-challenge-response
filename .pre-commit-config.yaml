# Instalar: uvx pre-commit install
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.2
    hooks:
      - id: gitleaks
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
      - id: ruff-format
  - repo: local
    hooks:
      - id: ai-logs-sem-pii
        name: ai-logs e docs sem segredo nem PII
        entry: uv run python scripts/sanitize_ai_logs.py --check
        language: system
        pass_filenames: false
        files: ^(ai-logs|docs)/
      - id: bloqueia-env
        name: bloqueia .env
        entry: .env nao pode ser commitado
        language: fail
        files: (^|/)\.env$
